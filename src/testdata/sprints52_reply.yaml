divergences:
- claim: |
    The constructed child environment for the CLAUDE_CLI backend widens: childEnv's keep
    set grows from {HOME, PATH, LANG, LC_ALL, TZ} plus OTEL_* to add USER and LOGNAME
    (internal/hahod/backend/claudecli.go:82-85, post-image), so hahod now passes two more
    of its own process-environment variables through to a requestor-triggered subprocess.
    This further departs from the RFC's construct-from-spec rule: "an environment
    constructed from the spec alone (nothing inherited)" (docs/haho-rfc.md, section 5) and
    "the environment is constructed from the spec's references and nothing else is
    inherited" (section 14). The authority — that the agent CLI resolves the credential it
    owns by account name and answers "Not logged in" without USER, which landed two FAILED
    jobs in the 2026-08-22 rehearsal (issue 13) — is a field observation in no provided
    design doc.
  necessary: true
  justification: |
    The passthrough is the same necessity class already ratified for HOME/PATH/locale: the
    prior firing on this PR recorded the departure as surfaced-not-silent and ratified it on
    the ground that "the CLI needs a home to find its own credentials and configuration, a
    PATH to find its runtime, and locale so its output is not mangled ... pinned by a test
    that would fail if they were dropped" (rulings/2026-08-21T164601Z-haho-pr9.yaml, fourth
    divergence). USER/LOGNAME extend that exact rationale — the CLI cannot find the
    credential it owns without its account name — so without them the kind cannot run its
    own jobs at all, which is the WHOLE_OR_ERROR half-answer this backend refuses to land.
    The field claim is the not-writable-any-other-way class this ledger ratifies for measured
    faults (rulings/2026-08-21T020255Z-delightd-pr129.yaml, first divergence;
    rulings/2026-08-22T064542Z-haho-pr11.yaml, first divergence). The security property the
    section-14 clause exists for is preserved and stated where it binds: "Identity is not a
