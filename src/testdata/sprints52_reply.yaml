shape_justification: |
  One hunk in the function that constructs the child environment plus its test, the smallest
  correct fix for a measured fault, with the reason written where the next editor meets it —
  the constraint-stated-where-it-binds register this ledger ratifies by name for this repo's
  backend work (rulings/2026-08-21T164601Z-haho-pr9.yaml, shape_justification). The comment
  does the work a comment exists to do rather than restating the map: it names the two
  variables, the mechanism that made their absence break the kind (the CLI resolves the
  credential it owns by account name), the exact symptom (the child answers "Not logged in"
  and exits 1 with nothing on stderr), the observed cost (two FAILED jobs in a second each,
  2026-08-22 rehearsal, issue 13), and the security distinction that makes the addition safe
  (identity is not a secret; the credential it unlocks never passes through here). The change
  preserves every property the prior head was ratified for: the environment is still
  CONSTRUCTED rather than inherited — the keep set is an explicit allow-list and OTEL_ a named
  prefix, so `cmd.Env` is never nil and the "inherit everything" trap section 14 forbids stays
  shut — and the secret-exclusion property is unchanged because USER/LOGNAME match no secret
  the daemon holds, which the untouched TestClaudeCLIChildDoesNotInheritHahodsSecrets still
  pins. The keep-half is test-pinned in the same diff: the suite now exports USER and asserts
  the child sees it (claudecli_test.go), so a regression that drops USER fails loudly rather
  than reintroducing the rehearsal fault. Blast radius is one function's keep set and its
  test: no enum, no admission branch, no contract, no wire shape, no route, no hand-edited
  generated code, no daemon flag. What keeps this from being a clean landing is only the
  documentation half — README's divergence-ledger enumeration of the constructed environment
  now omits the two variables this diff adds, and that enumeration is the exact surfacing the
  section-14 departure's acceptability was staked on — and the unpinned LOGNAME. Both are
  recorded divergences against an untouched, non-implicated document and a defensive sibling
  variable, not structural faults, and the repair is a four-line README edit in the same file
  the prior head already trued for this seam.
