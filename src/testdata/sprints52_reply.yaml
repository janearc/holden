    (internal/hahod/backend/claudecli.go:82-83, post-image) — hahod's 1Password-resolved
    HOLDEN_ANTHROPIC_KEY still matches no name in the keep set and no OTEL_ prefix, so it is
    still dropped, and the test that pins that (TestClaudeCLIChildDoesNotInheritHahodsSecrets,
